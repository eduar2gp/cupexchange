<div class="trade-dashboard" style="display: flex; flex-direction: column; width: 100%; min-height: 0; overflow: hidden;">

  <div class="top-bar" style="display: flex; flex-direction: column; width: 100%; min-height: 0; gap: 0.75rem;">
    @if (tradeVolumeData(); as data) {
    <div class="trade-volume-info">
      <div class="info-group">
        <span class="info-label">Volume:</span>
        <span class="info-value">{{ data.totalOpenVolume | number:'1.2-2' }}</span>
      </div>

      <div class="info-group">
        <span class="info-label">Traded (24h):</span>
        <span class="info-value">{{ data.tradedVolume24H | number:'1.2-2' }}</span>
      </div>
      <!-- Action Buttons -->
      <div class="action-buttons">
        <button type="button" class="btn btn-sell" routerLink="/add-order" [queryParams]="{ type: 'sell' }">
          {{ 'SELL' | translate }}
        </button>
        <button type="button" class="btn btn-buy" routerLink="/add-order" [queryParams]="{ type: 'buy' }">
          {{ 'BUY' | translate }}
        </button>
      </div>

    </div>
    } @else {
    <div class="loading-volume">Loading volume data...</div>
    }



    <div class="interval-selection-bar">
      @for (interval of availableIntervals; track interval) {
      <button type="button" [class.active]="interval === currentInterval" (click)="selectInterval(interval)">
        {{ interval }}
      </button>
      }
    </div>

    <div class="chart-type-toggle" role="tablist" aria-label="Chart type">
      <button type="button" role="tab" [attr.aria-selected]="chartType === 'candlestick'"
        [class.active]="chartType === 'candlestick'" (click)="selectChartType('candlestick')">
        Candlestick
      </button>

      <button type="button" role="tab" [attr.aria-selected]="chartType === 'line'" [class.active]="chartType === 'line'"
        (click)="selectChartType('line')">
        Line
      </button>
    </div>

    @if (isBrowser) {
    <div class="chart-wrapper" style="position: relative; width: 100%; min-height: 320px; height: clamp(320px, 48vh, 620px); min-width: 0; overflow: hidden;">
      <canvas baseChart [data]="chartData" [options]="chartOptions" [type]="chartType" [plugins]="[watermarkPlugin]"
        style="display: block; width: 100% !important; height: 100% !important;">
      </canvas>
    </div>
    } @else {
    <div class="chart-placeholder">
      Loading Chart...
    </div>
    }
  </div>
