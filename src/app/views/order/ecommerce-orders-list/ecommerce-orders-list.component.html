<div class="orders-container">
  @if (isLoading()) {
  <div class="loading-shade">
    <mat-spinner diameter="50"></mat-spinner>
  </div>
  } @else {
  <div class="table-wrapper">
    <table mat-table [dataSource]="orders()" class="mat-elevation-z0">

      <ng-container matColumnDef="total">
        <th mat-header-cell *matHeaderCellDef class="header-cell"> Total </th>
        <td mat-cell *matCellDef="let order" class="cell-text">
          <span class="order-total">
            <span class="order-total__amount">{{ order.totalPrice | number:'1.2-2' }}</span>
            <span class="order-total__currency">{{ order.currencyCode }}</span>
          </span>
        </td>
      </ng-container>

      <ng-container matColumnDef="status">
        <th mat-header-cell *matHeaderCellDef class="header-cell"> Status </th>
        <td mat-cell *matCellDef="let order">
          <mat-chip-set>
            <mat-chip [class]="'status-chip ' + order.status?.toLowerCase()">
              {{ order.status | uppercase }}
            </mat-chip>
          </mat-chip-set>
        </td>
      </ng-container>

      <ng-container matColumnDef="paid">
        <th mat-header-cell *matHeaderCellDef class="header-cell"> Payment </th>
        <td mat-cell *matCellDef="let order" class="cell-text">
          <span class="payment-status" [class.payment-status--paid]="order.paid" [class.payment-status--unpaid]="!order.paid">
            {{ order.paid ? 'Paid' : 'Not Paid' }}
          </span>
        </td>
      </ng-container>

      <ng-container matColumnDef="createdAt">
        <th mat-header-cell *matHeaderCellDef class="header-cell">Created At</th>
        <td mat-cell *matCellDef="let order">
          {{ order.createdAt | date:'medium' }}
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;" (click)="onOrderSelected(row)"></tr>
    </table>

    @if (orders().length === 0) {
    <div style="text-align: center; padding: 40px; color: var(--color-text-muted)">
      No orders found.
    </div>
    }
  </div>

  <mat-paginator [length]="totalElements()" [pageSize]="pageSize()" [pageIndex]="currentPage()"
    [pageSizeOptions]="[5, 10, 20, 50]" (page)="handlePageEvent($event)" showFirstLastButtons
    aria-label="Select page of orders">
  </mat-paginator>
  }
</div>
