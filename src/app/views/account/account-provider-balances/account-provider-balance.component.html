<mat-card class="provider-card">

  <mat-card-header>
    <mat-card-title>Provider Liquidity Overview</mat-card-title>
  </mat-card-header>

  <mat-card-content>

    <div class="loader" *ngIf="isLoading()">
      <mat-progress-spinner
        diameter="40"
        mode="indeterminate">
      </mat-progress-spinner>
    </div>

    <table
      mat-table
      [dataSource]="providerData()"
      *ngIf="!isLoading()"
      class="balance-table">

      <!-- Provider -->
      <ng-container matColumnDef="accountName">
        <th mat-header-cell *matHeaderCellDef>Provider</th>
        <td mat-cell *matCellDef="let row">
          {{ row.accountName }}
        </td>
      </ng-container>

      <!-- Gateway -->
      <ng-container matColumnDef="gatewayId">
        <th mat-header-cell *matHeaderCellDef>Gateway</th>
        <td mat-cell *matCellDef="let row">
          #{{ row.paymentGatewayId }}
        </td>
      </ng-container>

      <!-- Currency -->
      <ng-container matColumnDef="currency">
        <th mat-header-cell *matHeaderCellDef>Currency</th>
        <td mat-cell *matCellDef="let row">
          <strong class="currency">{{ row.currencyCode }}</strong>
        </td>
      </ng-container>

      <!-- Balance -->
      <ng-container matColumnDef="balance">
        <th mat-header-cell *matHeaderCellDef>Available Balance</th>
        <td
          mat-cell
          *matCellDef="let row"
          [class.low-liquidity]="row.calculatedBalance < 1000">

          {{ row.calculatedBalance | number:'1.2-8' }}

        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

    </table>

  </mat-card-content>

  <mat-paginator
    [length]="totalElements()"
    [pageSize]="pageSize()"
    [pageIndex]="currentPage()"
    [pageSizeOptions]="[5,10,25,50]"
    (page)="onPageChange($event)"
    showFirstLastButtons>
  </mat-paginator>

</mat-card>
