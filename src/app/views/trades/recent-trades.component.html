<div class="trade-list-grid stacked">
  <mat-card class="side-panel recent-trades-card">
    <mat-card-content class="order-list-container">

      <div class="list-header">
        <span class="price-col">{{ 'PRICE' | translate }}</span>
        <span class="volume-col">{{ 'VOLUME' | translate }}</span>
        <span class="time-col">{{ 'TIME' | translate }}</span>
      </div>

      <div class="scrollable-list">
        @for (trade of trades; track trade.timestamp) {
        <div class="order-item" [ngClass]="trade.side === 'BUY' ? 'buy-item' : 'sell-item'">

          <span class="price-col font-mono" [ngClass]="trade.side === 'BUY' ? 'buy-price' : 'sell-price'">
            {{ trade.price | number:priceFormat() }}
          </span>

          <span class="volume-col font-mono">
            {{ trade.volume | number:'1.0-2' }}
          </span>

          <span class="time-col font-mono text-muted">
            {{ formatTime(trade.timestamp) }}
          </span>

        </div>
        } @empty {
        <div class="no-data">
          <!--{{ 'WAITING_FOR_TRADES' | translate }}-->
        </div>
        }
      </div>
    </mat-card-content>
  </mat-card>
</div>
