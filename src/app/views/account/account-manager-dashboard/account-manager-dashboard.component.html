<div class="dashboard-wrapper mat-elevation-z8">
  <div class="header-container">
    <h1>Account Manager History</h1>
    <p class="subtitle">Click a row to process pending deposits or withdrawals</p>
  </div>

  <div class="loading-shade" *ngIf="isLoading()">
    <mat-spinner diameter="50"></mat-spinner>
  </div>

  <div class="table-container">
    <table mat-table [dataSource]="transactions()">

      <ng-container matColumnDef="id">
        <th mat-header-cell *matHeaderCellDef> ID </th>
        <td mat-cell *matCellDef="let tx"> #{{tx.id}} </td>
      </ng-container>

      <ng-container matColumnDef="referenceId">
        <th mat-header-cell *matHeaderCellDef> Reference </th>
        <td mat-cell *matCellDef="let tx"> {{tx.referenceId}} </td>
      </ng-container>

      <ng-container matColumnDef="type">
        <th mat-header-cell *matHeaderCellDef> Type </th>
        <td mat-cell *matCellDef="let tx">
          <mat-chip-set>
            <mat-chip [class.chip-withdrawal]="tx.type === 'WITHDRAWAL'" 
                      [class.chip-deposit]="tx.type === 'DEPOSIT'">
              {{tx.type}}
            </mat-chip>
          </mat-chip-set>
        </td>
      </ng-container>

      <ng-container matColumnDef="amount">
        <th mat-header-cell *matHeaderCellDef> Amount </th>
        <td mat-cell *matCellDef="let tx" class="font-bold"> 
          {{tx.amount | currency}} 
        </td>
      </ng-container>

      <ng-container matColumnDef="status">
        <th mat-header-cell *matHeaderCellDef> Status </th>
        <td mat-cell *matCellDef="let tx"> 
          <span class="status-label" [attr.data-status]="tx.status">
            {{tx.status}}
          </span>
        </td>
      </ng-container>

      <ng-container matColumnDef="timestamp">
        <th mat-header-cell *matHeaderCellDef> Date </th>
        <td mat-cell *matCellDef="let tx"> {{tx.timestamp | date:'medium'}} </td>
      </ng-container>

      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef> Receipt </th>
        <td mat-cell *matCellDef="let tx">
          <a mat-icon-button 
             color="primary" 
             *ngIf="tx.receiptPaymentUrl" 
             [href]="tx.receiptPaymentUrl" 
             target="_blank"
             (click)="$event.stopPropagation()">
            <mat-icon>receipt_long</mat-icon>
          </a>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns; sticky: true"></tr>
      <tr mat-row 
          *matRowDef="let row; columns: displayedColumns;" 
          (click)="onSelectTransaction(row)"
          class="interactive-row">
      </tr>

      <tr class="mat-row" *matNoDataRow>
        <td class="mat-cell empty-cell" colspan="7">
          No transactions found for this provider.
        </td>
      </tr>
    </table>
  </div>

  <mat-paginator [length]="totalElements"
                 [pageSize]="pageSize"
                 [pageSizeOptions]="[5, 10, 25, 50]"
                 (page)="handlePageEvent($event)"
                 showFirstLastButtons
                 aria-label="Select page of transactions">
  </mat-paginator>
</div>
