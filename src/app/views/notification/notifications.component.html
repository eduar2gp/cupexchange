<div class="notifications-wrapper">
  <div *ngIf="notifications$ | async as notifications; else loading">
    
    <div class="list-container">
      <mat-card *ngFor="let n of notifications; trackBy: trackByNotificationId" 
          [class.unread-card]="!n.seen" 
          class="notification-card">
        
        <mat-card-content>
          <div class="card-layout">
            <div class="status-indicator">
              <mat-icon *ngIf="!n.seen" color="primary">fiber_manual_record</mat-icon>
            </div>
            
            <div class="text-content">
              <div class="meta">
                <span class="title">{{ n.title }}</span>
                <span class="time">{{ n.createdAt | date:'shortTime' }}</span>
              </div>
              <p class="msg">{{ n.message }}</p>
            </div>

            <div class="actions">
              <button mat-stroked-button 
                      color="primary" 
                      *ngIf="!n.seen" 
                      (click)="markAsRead(n.id)">
                Mark as Read
              </button>
            </div>
          </div>
        </mat-card-content>
      </mat-card>
    </div>

    <mat-paginator [length]="totalElements"
                   [pageSize]="pageSize"
                   [pageIndex]="currentPage"
                   [pageSizeOptions]="[5, 10, 25, 50]"                
                   (page)="handlePageEvent($event)"
                   showFirstLastButtons>
    </mat-paginator>

    <div *ngIf="notifications.length === 0" class="empty-state">
      <mat-icon>notifications_none</mat-icon>
      <p>No notifications yet!</p>
    </div>
  </div>

  <ng-template #loading>
    <div class="loader-container">
      <mat-spinner diameter="40"></mat-spinner>
      <p>Loading updates...</p>
    </div>
  </ng-template>
</div>
