<div class="settings-panel">
  <mat-form-field appearance="outline" class="settings-field">
    <mat-label>{{ 'LANGUAGE' | translate }}</mat-label>
    <mat-select [value]="currentLang" (selectionChange)="changeLanguage($event.value)">
      <mat-option value="en">English</mat-option>
      <mat-option value="es">Español</mat-option>
      <mat-option value="ru">Русский</mat-option>
    </mat-select>
  </mat-form-field>

  <mat-form-field appearance="outline" class="settings-field">
    <mat-label>{{ 'THEME' | translate }}</mat-label>
    <mat-select [value]="currentThemeMode" (selectionChange)="changeTheme($event.value)">
      <mat-option value="light">{{ 'LIGHT_MODE' | translate }}</mat-option>
      <mat-option value="dark">{{ 'DARK_MODE' | translate }}</mat-option>
      <mat-option value="auto">{{ 'AUTO_TIME' | translate }}</mat-option>
    </mat-select>
  </mat-form-field>

  <mat-slide-toggle class="theme-toggle"
                    [checked]="notificationsEnabled"
                    (change)="toggleNotifications($event.checked)">
    {{ 'NOTIFICATIONS' | translate }}
  </mat-slide-toggle>
</div>
